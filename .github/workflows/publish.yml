name: CI & Publish

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bunx tsc --noEmit

  publish:
    needs: typecheck
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: bun install

      - name: Check if version changed
        id: version
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          # Publish only a version the registry does not have yet.
          if [ "$(npm view "river.ts@$CURRENT" version 2>/dev/null)" = "$CURRENT" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
          # A prerelease (1.3.0-test.1) goes to the "test" dist-tag, anything else to "latest".
          case "$CURRENT" in
            *-*) echo "tag=test" >> $GITHUB_OUTPUT ;;
            *) echo "tag=latest" >> $GITHUB_OUTPUT ;;
          esac

      - name: Build
        if: steps.version.outputs.changed == 'true'
        run: bun run build

      - name: Publish
        if: steps.version.outputs.changed == 'true'
        working-directory: ./dist
        run: npm publish --provenance --access public --tag ${{ steps.version.outputs.tag }}
